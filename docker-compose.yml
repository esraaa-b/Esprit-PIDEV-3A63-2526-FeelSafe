services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./var:/var/www/html/var
    working_dir: /var/www/html
    environment:
      DATABASE_URL: "mysql://root:root@db:3306/feelsafe?serverVersion=10.4.32-MariaDB&charset=utf8mb4"
    depends_on:
      - db
    command: apache2-foreground
  db:
    image: mariadb:10.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: feelsafe
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
