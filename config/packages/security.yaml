security:
    password_hashers:
        # ✅ FIX COMPATIBILITÉ SYMFONY ↔ JAVA
        #
        # Avant : 'auto' → Symfony choisissait bcrypt mais stockait avec préfixe "$2y$"
        # que jBCrypt (Java) ne reconnaissait pas.
        #
        # Solution : on force bcrypt avec cost: 13 (même valeur que gensalt(13) côté Java).
        # Symfony continue d'utiliser "$2y$" en interne, mais le fix côté Java dans
        # UtilisateurService.checkPassword() remplace "$2y$" par "$2a$" avant vérification.
        # Les deux sont algorithmiquement identiques.
        #
        # ⚠️ NE PAS changer migrate_from — cela efface la compatibilité avec les anciens hash.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: bcrypt
            cost: 13

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # OAuth Authenticators (Google + GitHub)
            custom_authenticators:
                - App\Security\GoogleAuthenticator
                - App\Security\GitHubAuthenticator

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
                always_use_default_target_path: false
                use_referer: true

            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/pro, roles: ROLE_PROFESSIONNEL }
        - { path: ^/client, roles: ROLE_CLIENT }
        - { path: ^/dashboard, roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
        ROLE_PROFESSIONNEL: [ROLE_USER]
        ROLE_CLIENT: [ROLE_USER]
