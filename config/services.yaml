# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    journal_images_dir: '%kernel.project_dir%/public/uploads/journals/images'
    journal_audio_dir: '%kernel.project_dir%/public/uploads/journals/audio'
    admin.secret.code: '%env(ADMIN_SECRET_CODE)%'
    uploads_directory: '%kernel.project_dir%/public/uploads'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
     # Controllers
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']
    App\Controller\AiJournalController:
        arguments:
            $anthropicApiKey: '%env(ANTHROPIC_API_KEY)%'

    # Repositories
    App\Repository\:
        resource: '../src/Repository/'

    # CSRF Token Manager
    Symfony\Component\Security\Csrf\CsrfTokenManagerInterface: '@security.csrf.token_manager'

      # ✅ Service IA pour l'inscription
    App\Service\RegistrationAIService:
        arguments:
            $openrouterApiKey: '%env(OPENROUTER_API_KEY)%'


 # Weather Service
    App\Service\WeatherService:
        arguments:
            $apiKey: '%env(OPENWEATHER_API_KEY)%'
            $defaultCity: '%env(OPENWEATHER_DEFAULT_CITY)%'

    # Activity Recommendation Service
    App\Service\ActivityRecommendationService:
        autowire: true
        autoconfigure: true

    App\Service\AIWellnessQuizService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'

